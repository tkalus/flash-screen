name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build universal binary
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          set -euo pipefail

          mkdir -p build dist

          for arch in arm64 x86_64; do
            swiftc \
              -target "${arch}-apple-macos13.0" \
              -framework AppKit \
              -o "build/flash-screen-${arch}" \
              flash-screen.swift
          done

          lipo -create \
            build/flash-screen-arm64 \
            build/flash-screen-x86_64 \
            -output dist/flash-screen

          chmod 755 dist/flash-screen
          file dist/flash-screen
          lipo -info dist/flash-screen

      - name: Upload universal binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flash-screen-universal
          path: dist/flash-screen
          retention-days: 1

  package-release:
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download universal binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: flash-screen-universal
          path: dist

      - name: Package release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tar -czf "dist/flash-screen-${RELEASE_TAG}-macos-universal.tar.gz" \
            -C dist flash-screen

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft \
            --prerelease \
            "dist/flash-screen-${RELEASE_TAG}-macos-universal.tar.gz"
